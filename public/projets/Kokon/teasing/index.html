<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kokon | La métamorphose approche</title>
    <link rel="icon" href="../img/papillon-violet.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* === RESET & VARIABLES === */
        :root {
            --purple-light: #b366ff;
            --purple: #7F0ABD;
            --dark: #09051e;
            --light: #ffffff;
            --glass-bg: rgba(20, 20, 30, 0.6);
            --glass-border: rgba(127, 10, 189, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 1rem; /* Ajout pour que ça respire sur mobile */
        }

        /* === FOND MYSTÉRIEUX (Lueurs violettes) === */
        .glow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1a0b2e 0%, var(--dark) 70%);
            overflow: hidden;
        }

        .glow-orb {
            position: absolute;
            width: 50vw;
            height: 50vw;
            background: var(--purple);
            filter: blur(120px);
            opacity: 0.15;
            border-radius: 50%;
            animation: float 10s infinite alternate ease-in-out;
        }

        .orb-1 { top: -20%; left: -10%; }
        .orb-2 { bottom: -20%; right: -10%; animation-delay: -5s; background: var(--purple-light); }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.2); }
        }

        /* === CONTENEUR PRINCIPAL === */
        .teaser-container {
            width: 100%;
            max-width: 800px;
            z-index: 10;
            text-align: center;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-img {
            width: clamp(150px, 40vw, 200px); /* Taille fluide */
            margin-bottom: 2rem;
            filter: drop-shadow(0 0 15px rgba(127, 10, 189, 0.5));
        }

        h1 {
            font-size: clamp(2rem, 8vw, 3.5rem); /* Ajusté pour mobile */
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        .highlight {
            background: linear-gradient(135deg, var(--purple-light), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: clamp(1rem, 4vw, 1.2rem);
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 3rem;
            font-weight: 300;
            padding: 0 1rem;
        }

        /* === COMPTEUR === */
        .countdown {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* Permet aux boîtes de passer à la ligne si besoin */
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .time-box {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.5rem;
            min-width: 100px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .time-box span {
            display: block;
            font-size: clamp(2rem, 6vw, 2.5rem);
            font-weight: 800;
            color: var(--light);
            text-shadow: 0 0 10px rgba(179, 102, 255, 0.5);
        }

        .time-box .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--purple-light);
            margin-top: 0.5rem;
            font-weight: 600;
        }

        /* === FORMULAIRE D'INSCRIPTION === */
        .registration-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            text-align: left;
        }

        .registration-card h2 {
            font-size: clamp(1.2rem, 5vw, 1.5rem);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        input, select {
            width: 100%;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: var(--light);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            appearance: none;
            -webkit-appearance: none;
        }

        input::placeholder { color: rgba(255, 255, 255, 0.4); }

        select option {
            background-color: var(--dark);
            color: var(--light);
        }

        input:focus, select:focus {
            border-color: var(--purple-light);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(179, 102, 255, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, var(--purple-light), var(--purple));
            color: var(--light);
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 1rem;
            box-shadow: 0 10px 25px rgba(127, 10, 189, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(127, 10, 189, 0.6);
        }

        /* === ESSAIM DE PAPILLONS === */
        .wandering-butterfly {
            position: fixed;
            z-index: 50; 
            pointer-events: none;
            width: 30px;
            height: 30px;
            filter: drop-shadow(0px 0px 8px rgba(179, 102, 255, 0.8));
        }

        .wandering-butterfly .wing {
            position: absolute;
            width: 15px;
            height: 25px;
            background: linear-gradient(135deg, var(--purple-light), var(--purple));
            opacity: 0.85;
        }

        .wandering-butterfly .wing-left {
            left: 0;
            border-radius: 100% 0% 50% 100%;
            transform-origin: right center;
            animation: flap-left 0.1s infinite alternate ease-in-out;
        }

        .wandering-butterfly .wing-right {
            right: 0;
            border-radius: 0% 100% 100% 50%;
            transform-origin: left center;
            animation: flap-right 0.1s infinite alternate ease-in-out;
        }

        .wandering-butterfly::after {
            content: ''; position: absolute; left: 14px; top: 2px;
            width: 2px; height: 18px; background: rgba(255,255,255,0.8);
            border-radius: 10px;
        }

        @keyframes flap-left { 0% { transform: rotateY(0deg) rotateZ(-15deg); } 100% { transform: rotateY(70deg) rotateZ(-15deg); } }
        @keyframes flap-right { 0% { transform: rotateY(0deg) rotateZ(15deg); } 100% { transform: rotateY(-70deg) rotateZ(15deg); } }

        .butterfly-1 { animation: fly-path-1 18s linear infinite; }
        .butterfly-2 { animation: fly-path-2 25s linear infinite; animation-delay: -7s; }
        .butterfly-3 { animation: fly-path-3 20s linear infinite; animation-delay: -14s; }

        @keyframes fly-path-1 {
            0% { top: 80%; left: -10%; transform: scale(0.8) rotate(60deg); }
            30% { top: 30%; left: 30%; transform: scale(1) rotate(45deg); }
            60% { top: 50%; left: 70%; transform: scale(0.9) rotate(80deg); }
            100% { top: 20%; left: 120%; transform: scale(0.8) rotate(60deg); }
        }

        @keyframes fly-path-2 {
            0% { top: 10%; left: 110%; transform: scale(0.5) rotate(-120deg); opacity: 0.7; }
            40% { top: 60%; left: 60%; transform: scale(0.6) rotate(-90deg); opacity: 0.7; }
            80% { top: 30%; left: 20%; transform: scale(0.4) rotate(-140deg); opacity: 0.7; }
            100% { top: 70%; left: -10%; transform: scale(0.5) rotate(-100deg); opacity: 0.7; }
        }

        @keyframes fly-path-3 {
            0% { top: 110%; left: 40%; transform: scale(1.2) rotate(-10deg); }
            25% { top: 70%; left: 60%; transform: scale(1.1) rotate(30deg); }
            50% { top: 40%; left: 30%; transform: scale(1.3) rotate(-20deg); }
            75% { top: 10%; left: 50%; transform: scale(1.1) rotate(15deg); }
            100% { top: -20%; left: 70%; transform: scale(1.2) rotate(0deg); }
        }

        /* === AJUSTEMENTS RESPONSIVE POUR MOBILE === */
        @media (max-width: 600px) {
            .countdown {
                gap: 0.5rem;
                margin-bottom: 2rem;
            }
            .time-box {
                min-width: 70px; /* Réduit pour rentrer 4 boîtes sur petits écrans */
                padding: 1rem 0.5rem;
            }
            .time-box span {
                font-size: 1.5rem;
            }
            .time-box .label {
                font-size: 0.65rem;
                letter-spacing: 1px;
            }
            .form-grid {
                grid-template-columns: 1fr; /* Prénom/Nom l'un sous l'autre */
                gap: 1rem;
            }
            .registration-card {
                padding: 2rem 1.5rem;
                border-radius: 16px;
            }
            input, select {
                padding: 0.9rem 1.2rem;
                font-size: 0.95rem;
            }
            .btn-submit {
                font-size: 1rem;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="wandering-butterfly butterfly-1">
        <div class="wing wing-left"></div>
        <div class="wing wing-right"></div>
    </div>
    
    <div class="wandering-butterfly butterfly-2">
        <div class="wing wing-left"></div>
        <div class="wing wing-right"></div>
    </div>
    
    <div class="wandering-butterfly butterfly-3">
        <div class="wing wing-left"></div>
        <div class="wing wing-right"></div>
    </div>
    
    <div class="glow-bg">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <div class="teaser-container">
        
        <img src="../img/logo-kokon-blanc.png" alt="Logo Kokon" class="logo-img" onerror="this.src='https://placehold.co/200x60/09090e/FFFFFF?text=KOKON'">
        
        <h1>un nouveau concept va <br> éclore sur le <span class="highlight">KAMPUS</span>...</h1>
        <p class="subtitle">Le premier incubateur hybride du Grand Est ouvre ses portes fin septembre.</p>
        
        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <div class="label">Jours</div>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <div class="label">Heures</div>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <div class="label">Minutes</div>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <div class="label">Secondes</div>
            </div>
        </div>

        <div class="registration-card">
            <h2>S'inscrire à l'événement de lancement</h2>
            <form action="#" method="POST">
                <div class="form-grid">
                    <input type="text" placeholder="Prénom" required aria-label="Prénom">
                    <input type="text" placeholder="Nom" required aria-label="Nom">
                </div>
                
                <input type="email" placeholder="Adresse e-mail" required aria-label="Adresse e-mail" style="margin-bottom: 1rem;">
                
                <select required aria-label="Votre profil">
                    <option value="" disabled selected>Je suis...</option>
                    <option value="student">Étudiant / Alumni (Porteur de projet)</option>
                    <option value="professional">Professionnel / Entreprise de l'EEE</option>
                </select>
                
                <button type="submit" class="btn-submit">Prendre mon envol</button>
            </form>
            <p style="font-size: 0.8rem; color: rgba(255,255,255,0.4); text-align: center; margin-top: 1rem;">
                Places limitées. Une invitation officielle te sera envoyée.
            </p>
        </div>

    </div>

    <script>
        // Date cible : Lancement prévu fin septembre 2026 (ex: 30 Septembre 2026 à 18h00)
        const countDownDate = new Date("Sep 30, 2026 18:00:00").getTime();

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            // Calculs du temps
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Formatage avec un "0" devant si < 10
            document.getElementById("days").innerHTML = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerHTML = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerHTML = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerHTML = seconds < 10 ? "0" + seconds : seconds;

            // Texte si le compte à rebours est terminé
            if (distance < 0) {
                clearInterval(x);
                document.querySelector(".countdown").innerHTML = "<div style='font-size: 2rem; color: #b366ff; font-weight: bold;'>La métamorphose a commencé.</div>";
            }
        }, 1000);
    </script>
</body>
</html>
